<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Starling Murmuration — Emergent Swarm</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; color: #e0e8f0; }
  #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  
  /* UI Overlay */
  .hud {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  .hud-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #f0f6fc;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
  }
  .hud-sub {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(240,246,252,0.7);
    text-shadow: 0 1px 6px rgba(0,0,0,0.85);
  }
  
  .controls-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 20;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e2e8f0;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    letter-spacing: 0.06em;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.2s;
  }
  .controls-toggle:hover { background: rgba(30, 41, 59, 0.9); border-color: rgba(255, 255, 255, 0.3); }

  .panel {
    position: absolute;
    top: 58px;
    right: 16px;
    z-index: 20;
    width: 280px;
    background: rgba(10, 15, 28, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 16px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
    transition: opacity 0.25s, transform 0.25s;
  }
  .panel.hidden { opacity: 0; transform: translateY(-10px); pointer-events: none; }

  .control-group { display: flex; flex-direction: column; gap: 6px; }
  .control-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(240,246,252,0.8); }
  
  /* Touch-optimized sliders */
  .slider-box {
    position: relative;
    height: 36px;
    display: flex;
    align-items: center;
    touch-action: none;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
  }
  input[type="range"]:active::-webkit-slider-thumb {
    transform: scale(1.25);
    background: #7dd3fc;
    box-shadow: 0 0 16px rgba(125, 211, 252, 0.9);
  }

  /* Theme Switcher */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .theme-btn {
    padding: 6px 4px;
    font-size: 10px;
    font-weight: 600;
    text-align: center;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    transition: all 0.2s;
  }
  .theme-btn.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: #38bdf8;
    color: #38bdf8;
  }

  .action-btn {
    width: 100%;
    padding: 8px 0;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:hover { background: rgba(239, 68, 68, 0.35); border-color: #ef4444; }

  .instructions {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: rgba(240, 246, 252, 0.55);
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="hud">
  <div class="hud-title">Starling Murmuration</div>
  <div class="hud-sub" id="hud-stats">1,400 Birds • Wide Horizon Perspective</div>
</div>

<button class="controls-toggle" id="toggle-panel">Controls ⚙</button>

<div class="panel" id="panel">
  <div class="control-group">
    <div class="control-header"><span>Flock Size</span><span id="val-flock">1400</span></div>
    <div class="slider-box"><input type="range" id="param-flock" min="300" max="3000" step="50" value="1400"></div>
  </div>

  <div class="control-group">
    <div class="control-header"><span>Swarm Cohesion</span><span id="val-cohesion">1.3</span></div>
    <div class="slider-box"><input type="range" id="param-cohesion" min="0.2" max="3.0" step="0.1" value="1.3"></div>
  </div>

  <div class="control-group">
    <div class="control-header"><span>Roost Affinity</span><span id="val-perch">0.7</span></div>
    <div class="slider-box"><input type="range" id="param-perch" min="0.0" max="2.0" step="0.1" value="0.7"></div>
  </div>

  <div class="control-group">
    <div class="control-header"><span>Sky Palette</span></div>
    <div class="theme-grid">
      <button class="theme-btn active" data-theme="dusk">Dusk</button>
      <button class="theme-btn" data-theme="sunset">Sunset</button>
      <button class="theme-btn" data-theme="dawn">Dawn</button>
      <button class="theme-btn" data-theme="void">Night</button>
    </div>
  </div>

  <button class="action-btn" id="btn-hawk">⚡ Hawk Strike (Scare Flock)</button>
  <button class="action-btn" style="background:rgba(56,189,248,0.15);border-color:rgba(56,189,248,0.3);color:#7dd3fc;" id="btn-flush">🍃 Flush Roosting Birds</button>
</div>

<div class="instructions">Click or drag across sky to summon hawk • Tap tree / wires to flush flock</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width = 0, height = 0;

  // --- Color Palettes ---
  const palettes = {
    dusk: {
      sky: ['#0a1226', '#18203c', '#382f50', '#744f66', '#c47868'],
      silhouette: '#060810',
      wire: '#070a12',
      hawk: '#2a0914'
    },
    sunset: {
      sky: ['#100b22', '#35143a', '#772640', '#c54833', '#f49948'],
      silhouette: '#06040b',
      wire: '#07050d',
      hawk: '#340811'
    },
    dawn: {
      sky: ['#06172c', '#0f3656', '#38667e', '#929a90', '#e7bf96'],
      silhouette: '#040b12',
      wire: '#050d16',
      hawk: '#181622'
    },
    void: {
      sky: ['#010306', '#03060d', '#060914', '#0a0f1e', '#12192b'],
      silhouette: '#000000',
      wire: '#040609',
      hawk: '#1a1a22'
    }
  };

  let currentTheme = 'dusk';

  // --- Swarm Settings ---
  let targetFlockSize = 1400;
  let cohesionWeight = 1.3;
  let perchAffinity = 0.7;
  const TOPOLOGICAL_NEIGHBORS = 7;
  const MAX_SPEED = 4.8;
  const MIN_SPEED = 2.0;
  const MAX_FORCE = 0.20;

  // --- Perch Points & Landscape Geometry Cache ---
  let perches = [];
  let treeBranches = [];
  let groundY = 0;
  let poleGeom = null;
  let wireCurves = [];

  // Seeded deterministic random for consistent organic tree fractal
  function createSeededRandom(seed = 42) {
    let s = seed;
    return () => {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }

  function generateLandscape() {
    perches = [];
    treeBranches = [];
    wireCurves = [];
    groundY = height * 0.94;

    // 1. Hydro Utility Pole (Left-mid side, vantage back)
    const poleX = width * 0.22;
    const poleH = height * 0.38; // Proportional distant scale
    const poleTopY = groundY - poleH;
    
    poleGeom = {
      x: poleX,
      groundY: groundY,
      topY: poleTopY,
      width: Math.max(5, width * 0.007),
      crossarm1Y: poleTopY + poleH * 0.08,
      crossarm1W: poleH * 0.50,
      crossarm2Y: poleTopY + poleH * 0.22,
      crossarm2W: poleH * 0.42,
      transX: poleX + poleH * 0.12,
      transY: poleTopY + poleH * 0.32,
      transW: poleH * 0.15,
      transH: poleH * 0.25
    };

    // Build Interconnected Sagging Hydro Lines spanning across horizon
    const leftAnchorX = -width * 0.05;
    const rightAnchorX = width * 1.05;
    
    // Top High-Voltage Line (through top crossarm insulators)
    wireCurves.push({
      p0: { x: leftAnchorX, y: poleGeom.crossarm1Y - 8 },
      cp1: { x: (leftAnchorX + poleX) / 2, y: poleGeom.crossarm1Y + 12 },
      p1: { x: poleX - poleGeom.crossarm1W * 0.42, y: poleGeom.crossarm1Y }
    });
    wireCurves.push({
      p0: { x: poleX + poleGeom.crossarm1W * 0.42, y: poleGeom.crossarm1Y },
      cp1: { x: (poleX + rightAnchorX) / 2, y: poleGeom.crossarm1Y + 36 },
      p1: { x: rightAnchorX, y: poleGeom.crossarm1Y + 60 }
    });

    // Secondary Distribution Lines (through second crossarm)
    for (let i = 0; i < 3; i++) {
      const yShift = i * 14;
      const sag = 20 + i * 8;
      // Left span
      wireCurves.push({
        p0: { x: leftAnchorX, y: poleGeom.crossarm2Y + yShift - 15 },
        cp1: { x: (leftAnchorX + poleX) * 0.48, y: poleGeom.crossarm2Y + yShift + sag },
        p1: { x: poleX - poleGeom.crossarm2W * 0.4 + i * 8, y: poleGeom.crossarm2Y + yShift }
      });
      // Right sweep span
      wireCurves.push({
        p0: { x: poleX + poleGeom.crossarm2W * 0.4 - i * 4, y: poleGeom.crossarm2Y + yShift },
        cp1: { x: poleX + (rightAnchorX - poleX) * 0.45, y: poleGeom.crossarm2Y + yShift + sag * 1.6 },
        p1: { x: rightAnchorX, y: poleGeom.crossarm2Y + yShift + 80 }
      });
    }

    // Lower Communication / Guy wire
    wireCurves.push({
      p0: { x: poleX, y: poleGeom.topY + poleH * 0.65 },
      cp1: { x: poleX * 0.5, y: poleGeom.topY + poleH * 0.75 },
      p1: { x: leftAnchorX, y: groundY - 10 }
    });

    // Sample Perch Spots along all sagging wires
    for (const curve of wireCurves) {
      const steps = 30;
      for (let s = 1; s < steps; s++) {
        const t = s / steps;
        // Quadratic Bezier interpolation
        const invT = 1 - t;
        const px = invT * invT * curve.p0.x + 2 * invT * t * curve.cp1.x + t * t * curve.p1.x;
        const py = invT * invT * curve.p0.y + 2 * invT * t * curve.cp1.y + t * t * curve.p1.y;
        
        // Tangent angle
        const tx = 2 * invT * (curve.cp1.x - curve.p0.x) + 2 * t * (curve.p1.x - curve.cp1.x);
        const ty = 2 * invT * (curve.cp1.y - curve.p0.y) + 2 * t * (curve.p1.y - curve.cp1.y);
        const ang = Math.atan2(ty, tx);

        if (px > 0 && px < width) {
          perches.push({ x: px, y: py - 1, type: 'wire', occupied: null, angle: ang });
        }
      }
    }

    // 2. Bare Autumn/Winter Oak Tree Silhouette (Right side, distant view)
    const treeX = width * 0.78;
    const treeH = height * 0.46;
    const treeTrunkY = groundY;
    const rng = createSeededRandom(1337);

    function buildBranch(x1, y1, length, angle, depth, thickness) {
      const x2 = x1 + Math.cos(angle) * length;
      const y2 = y1 + Math.sin(angle) * length;

      treeBranches.push({ x1, y1, x2, y2, thickness, depth });

      // Add perch spot at branch tips and strong nodes
      if (depth >= 3 || (depth >= 2 && rng() > 0.4)) {
        perches.push({
          x: x2,
          y: y2 - 1,
          type: 'tree',
          occupied: null,
          angle: (rng() - 0.5) * 0.5
        });
      }

      if (depth >= 6 || length < 7) return;

      const branchesCount = depth <= 2 ? 3 : (rng() > 0.3 ? 2 : 3);
      for (let b = 0; b < branchesCount; b++) {
        const angleSpread = (b - (branchesCount - 1) / 2) * (0.35 + rng() * 0.25);
        const nextAngle = angle + angleSpread + (rng() - 0.5) * 0.2;
        const nextLen = length * (0.65 + rng() * 0.18);
        const nextThick = Math.max(0.7, thickness * 0.65);
        buildBranch(x2, y2, nextLen, nextAngle, depth + 1, nextThick);
      }
    }

    // Main Trunk & Primary Scaffold
    const trunkW = Math.max(9, width * 0.012);
    treeBranches.push({
      x1: treeX,
      y1: treeTrunkY,
      x2: treeX,
      y2: treeTrunkY - treeH * 0.32,
      thickness: trunkW,
      depth: 0,
      isTrunk: true
    });

    // Sub-branches splitting upwards
    buildBranch(treeX, treeTrunkY - treeH * 0.32, treeH * 0.26, -Math.PI * 0.5 - 0.32, 1, trunkW * 0.65);
    buildBranch(treeX, treeTrunkY - treeH * 0.32, treeH * 0.28, -Math.PI * 0.5 + 0.28, 1, trunkW * 0.65);
    buildBranch(treeX, treeTrunkY - treeH * 0.24, treeH * 0.22, -Math.PI * 0.5 - 0.65, 2, trunkW * 0.45);
    buildBranch(treeX, treeTrunkY - treeH * 0.26, treeH * 0.22, -Math.PI * 0.5 + 0.62, 2, trunkW * 0.45);
  }

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    generateLandscape();
  }

  // --- Spatial Hash for O(N) Flocking ---
  class SpatialGrid {
    constructor(cellSize) {
      this.cellSize = cellSize;
      this.grid = new Map();
    }
    clear() {
      this.grid.clear();
    }
    hash(x, y) {
      const gx = Math.floor(x / this.cellSize);
      const gy = Math.floor(y / this.cellSize);
      return (gx * 73856093) ^ (gy * 19349663);
    }
    insert(bird) {
      const h = this.hash(bird.x, bird.y);
      let cell = this.grid.get(h);
      if (!cell) {
        cell = [];
        this.grid.set(h, cell);
      }
      cell.push(bird);
    }
    getNeighbors(bird, radius) {
      const minX = Math.floor((bird.x - radius) / this.cellSize);
      const maxX = Math.floor((bird.x + radius) / this.cellSize);
      const minY = Math.floor((bird.y - radius) / this.cellSize);
      const maxY = Math.floor((bird.y + radius) / this.cellSize);
      const list = [];
      for (let gx = minX; gx <= maxX; gx++) {
        for (let gy = minY; gy <= maxY; gy++) {
          const h = (gx * 73856093) ^ (gy * 19349663);
          const cell = this.grid.get(h);
          if (cell) {
            for (let i = 0; i < cell.length; i++) {
              if (cell[i] !== bird) list.push(cell[i]);
            }
          }
        }
      }
      return list;
    }
  }

  const grid = new SpatialGrid(60);

  // --- Hawk / Raptor Threat Entity ---
  const hawk = {
    active: false,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    timer: 0,
    strike(tx, ty) {
      this.active = true;
      this.timer = 190;
      this.x = tx < width / 2 ? -50 : width + 50;
      this.y = ty - 120 + (Math.random() - 0.5) * 80;
      const angle = Math.atan2(ty - this.y, tx - this.x);
      const spd = 11.0;
      this.vx = Math.cos(angle) * spd;
      this.vy = Math.sin(angle) * spd;
    },
    update() {
      if (!this.active) return;
      this.x += this.vx;
      this.y += this.vy;
      this.timer--;
      if (this.timer <= 0 || this.x < -100 || this.x > width + 100 || this.y > height + 100) {
        this.active = false;
      }
    },
    draw() {
      if (!this.active) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      const heading = Math.atan2(this.vy, this.vx);
      ctx.rotate(heading);
      ctx.fillStyle = palettes[currentTheme].hawk;
      
      // Aerodynamic raptor silhouette
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(5, -6);
      ctx.lineTo(-5, -26); // Left wingtip
      ctx.lineTo(-3, -7);
      ctx.lineTo(-14, -4);
      ctx.lineTo(-20, 0); // Tail
      ctx.lineTo(-14, 4);
      ctx.lineTo(-3, 7);
      ctx.lineTo(-5, 26); // Right wingtip
      ctx.lineTo(5, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  };

  // --- Starling Boid Entity (Distant scale with wing silhouettes) ---
  class Starling {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = Math.random() * width;
      this.y = Math.random() * (height * 0.58);
      const ang = Math.random() * Math.PI * 2;
      const spd = MIN_SPEED + Math.random() * 1.8;
      this.vx = Math.cos(ang) * spd;
      this.vy = Math.sin(ang) * spd;
      this.ax = 0;
      this.ay = 0;
      
      this.state = 'flying'; // 'flying', 'landing', 'perched', 'flushing'
      this.perchTarget = null;
      this.wingPhase = Math.random() * Math.PI * 2;
      this.wingSpeed = 0.26 + Math.random() * 0.12;
      this.scale = 0.65 + Math.random() * 0.35; // Distant vantage scale
    }

    applyForce(fx, fy) {
      this.ax += fx;
      this.ay += fy;
    }

    flock(neighbors) {
      if (this.state !== 'flying') return;

      let count = 0;
      let alignX = 0, alignY = 0;
      let cohX = 0, cohY = 0;
      let sepX = 0, sepY = 0;

      for (let i = 0; i < neighbors.length && count < TOPOLOGICAL_NEIGHBORS; i++) {
        const other = neighbors[i];
        if (other.state !== 'flying') continue;

        const dx = other.x - this.x;
        const dy = other.y - this.y;
        const d2 = dx * dx + dy * dy;

        if (d2 > 0 && d2 < 12000) {
          const d = Math.sqrt(d2);
          alignX += other.vx;
          alignY += other.vy;
          cohX += other.x;
          cohY += other.y;

          if (d < 24) {
            sepX -= (dx / d) * (24 - d);
            sepY -= (dy / d) * (24 - d);
          }
          count++;
        }
      }

      if (count > 0) {
        // Alignment
        alignX /= count;
        alignY /= count;
        const aLen = Math.hypot(alignX, alignY) || 1;
        const steerAX = (alignX / aLen) * MAX_SPEED - this.vx;
        const steerAY = (alignY / aLen) * MAX_SPEED - this.vy;
        this.applyForce(steerAX * 0.62, steerAY * 0.62);

        // Cohesion
        cohX /= count;
        cohY /= count;
        const toCenterX = cohX - this.x;
        const toCenterY = cohY - this.y;
        const cLen = Math.hypot(toCenterX, toCenterY) || 1;
        const steerCX = (toCenterX / cLen) * MAX_SPEED - this.vx;
        const steerCY = (toCenterY / cLen) * MAX_SPEED - this.vy;
        this.applyForce(steerCX * 0.48 * cohesionWeight, steerCY * 0.48 * cohesionWeight);

        // Separation
        this.applyForce(sepX * 0.88, sepY * 0.88);
      }

      // Predator Panic Reaction
      if (hawk.active) {
        const hdx = this.x - hawk.x;
        const hdy = this.y - hawk.y;
        const hd2 = hdx * hdx + hdy * hdy;
        if (hd2 < 48000) { // 220px evasion sphere
          const hd = Math.sqrt(hd2) || 1;
          const fear = (220 - hd) / 220;
          this.applyForce((hdx / hd) * fear * 2.9, (hdy / hd) * fear * 2.9);
          this.wingSpeed = 0.52;
        }
      }

      // Boundaries Soft Cushion
      const pad = 80;
      if (this.x < pad) this.applyForce(0.18, 0);
      if (this.x > width - pad) this.applyForce(-0.18, 0);
      if (this.y < pad) this.applyForce(0, 0.22);
      if (this.y > groundY - 70) this.applyForce(0, -0.32);

      // Organic Roost Attraction
      if (perchAffinity > 0 && Math.random() < 0.0007 * perchAffinity) {
        this.seekPerch();
      }
    }

    seekPerch() {
      if (perches.length === 0) return;
      const idx = Math.floor(Math.random() * perches.length);
      const target = perches[idx];
      if (!target.occupied) {
        target.occupied = this;
        this.perchTarget = target;
        this.state = 'landing';
      }
    }

    flush() {
      if (this.state === 'perched' || this.state === 'landing') {
        if (this.perchTarget) {
          this.perchTarget.occupied = null;
          this.perchTarget = null;
        }
        this.state = 'flushing';
        const blastAngle = -Math.PI * 0.5 + (Math.random() - 0.5) * 1.3;
        const spd = 4.2 + Math.random() * 2.2;
        this.vx = Math.cos(blastAngle) * spd;
        this.vy = Math.sin(blastAngle) * spd;
        setTimeout(() => { if (this.state === 'flushing') this.state = 'flying'; }, 500 + Math.random() * 600);
      }
    }

    update() {
      if (this.state === 'perched') {
        this.wingPhase = 0;
        return;
      }

      if (this.state === 'landing' && this.perchTarget) {
        const dx = this.perchTarget.x - this.x;
        const dy = this.perchTarget.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 3.5) {
          this.x = this.perchTarget.x;
          this.y = this.perchTarget.y;
          this.vx = 0;
          this.vy = 0;
          this.state = 'perched';
          return;
        }

        const approachSpeed = Math.min(MAX_SPEED, Math.max(0.9, dist * 0.05));
        this.vx = (dx / dist) * approachSpeed;
        this.vy = (dy / dist) * approachSpeed;
        this.x += this.vx;
        this.y += this.vy;
        this.wingPhase += this.wingSpeed * 0.65;
        return;
      }

      // Dynamics Update
      const forceLen = Math.hypot(this.ax, this.ay);
      if (forceLen > MAX_FORCE) {
        this.ax = (this.ax / forceLen) * MAX_FORCE;
        this.ay = (this.ay / forceLen) * MAX_FORCE;
      }

      this.vx += this.ax;
      this.vy += this.ay;

      const speed = Math.hypot(this.vx, this.vy) || 1;
      if (speed > MAX_SPEED) {
        this.vx = (this.vx / speed) * MAX_SPEED;
        this.vy = (this.vy / speed) * MAX_SPEED;
      } else if (speed < MIN_SPEED) {
        this.vx = (this.vx / speed) * MIN_SPEED;
        this.vy = (this.vy / speed) * MIN_SPEED;
      }

      this.x += this.vx;
      this.y += this.vy;

      this.ax = 0;
      this.ay = 0;

      this.wingPhase += this.wingSpeed * (speed / 2.8);
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);

      if (this.state === 'perched') {
        const perchAng = this.perchTarget ? this.perchTarget.angle : 0;
        ctx.rotate(perchAng);
        ctx.fillStyle = palettes[currentTheme].silhouette;
        
        // Compact perched starling dot/silhouette
        ctx.beginPath();
        ctx.ellipse(0, -2.2 * this.scale, 1.8 * this.scale, 3.2 * this.scale, 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(1.2 * this.scale, -4.5 * this.scale);
        ctx.lineTo(3.2 * this.scale, -4.2 * this.scale);
        ctx.lineTo(1.2 * this.scale, -3.2 * this.scale);
        ctx.fill();
        ctx.restore();
        return;
      }

      // Flying silhouette with wing stroke cycle
      const heading = Math.atan2(this.vy, this.vx);
      ctx.rotate(heading);
      ctx.scale(this.scale, this.scale);

      const wingCycle = Math.sin(this.wingPhase); // -1 to 1
      const wingSpan = 5.8;
      const wingTipY = wingCycle * 4.8;

      ctx.fillStyle = palettes[currentTheme].silhouette;

      ctx.beginPath();
      ctx.moveTo(4.2, 0); // Beak
      ctx.lineTo(1.6, -1.0);
      ctx.lineTo(-0.8, -wingSpan); // Left wing
      ctx.lineTo(-2.0, -wingTipY);
      ctx.lineTo(-3.2, -0.6);
      ctx.lineTo(-5.5, 0); // Tail
      ctx.lineTo(-3.2, 0.6);
      ctx.lineTo(-2.0, wingTipY);
      ctx.lineTo(-0.8, wingSpan); // Right wing
      ctx.lineTo(1.6, 1.0);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Landscape Rendering: Intricate Winter Tree & Hydro Utility Pole ---
  function drawSky() {
    const pal = palettes[currentTheme];
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    const stops = pal.sky.length;
    for (let i = 0; i < stops; i++) {
      grad.addColorStop(i / (stops - 1), pal.sky[i]);
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
  }

  function drawLandscape() {
    const pal = palettes[currentTheme];
    ctx.fillStyle = pal.silhouette;
    ctx.strokeStyle = pal.silhouette;

    // Ground horizon silhouette
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(width, groundY);
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.fill();

    // 1. Hydro Utility Pole & Transformer Apparatus (Faithful Reference Render)
    if (poleGeom) {
      const p = poleGeom;
      
      // Main Tapered Wooden Mast
      ctx.beginPath();
      ctx.moveTo(p.x - p.width * 0.8, p.groundY);
      ctx.lineTo(p.x - p.width * 0.45, p.topY);
      ctx.quadraticCurveTo(p.x, p.topY - 4, p.x + p.width * 0.45, p.topY);
      ctx.lineTo(p.x + p.width * 0.8, p.groundY);
      ctx.fill();

      // Top Crossarm & Insulator Pins
      ctx.fillRect(p.x - p.crossarm1W * 0.5, p.crossarm1Y, p.crossarm1W, 5);
      // Diagonal struts
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(p.x - p.crossarm1W * 0.35, p.crossarm1Y + 5);
      ctx.lineTo(p.x, p.crossarm1Y + 24);
      ctx.lineTo(p.x + p.crossarm1W * 0.35, p.crossarm1Y + 5);
      ctx.stroke();

      // 4 Top Insulators
      [-0.42, -0.15, 0.15, 0.42].forEach(ratio => {
        const ix = p.x + p.crossarm1W * ratio;
        ctx.fillRect(ix - 2, p.crossarm1Y - 6, 4, 6);
        ctx.fillRect(ix - 3.5, p.crossarm1Y - 8, 7, 2);
      });

      // Second Lower Crossarm
      ctx.fillRect(p.x - p.crossarm2W * 0.5, p.crossarm2Y, p.crossarm2W, 5);
      // Lower Diagonal struts
      ctx.beginPath();
      ctx.moveTo(p.x - p.crossarm2W * 0.3, p.crossarm2Y + 5);
      ctx.lineTo(p.x, p.crossarm2Y + 20);
      ctx.lineTo(p.x + p.crossarm2W * 0.3, p.crossarm2Y + 5);
      ctx.stroke();

      // Lower Insulator Pins
      [-0.38, -0.12, 0.12, 0.38].forEach(ratio => {
        const ix = p.x + p.crossarm2W * ratio;
        ctx.fillRect(ix - 2, p.crossarm2Y - 5, 4, 5);
      });

      // Heavy Distribution Transformer Drum (Mounted right side of mast)
      ctx.beginPath();
      ctx.roundRect(p.transX - p.transW * 0.5, p.transY, p.transW, p.transH, 3);
      ctx.fill();
      // Transformer Top Lid Bushings
      ctx.fillRect(p.transX - p.transW * 0.3, p.transY - 5, 4, 5);
      ctx.fillRect(p.transX + p.transW * 0.1, p.transY - 5, 4, 5);
      // Secondary Jumper Wires
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(p.transX - p.transW * 0.2, p.transY - 5);
      ctx.quadraticCurveTo(p.transX - p.transW * 0.6, p.crossarm2Y + 12, p.x + p.crossarm2W * 0.12, p.crossarm2Y + 4);
      ctx.moveTo(p.transX + p.transW * 0.2, p.transY - 5);
      ctx.quadraticCurveTo(p.transX + p.transW * 0.7, p.crossarm2Y + 14, p.x + p.crossarm2W * 0.38, p.crossarm2Y + 4);
      ctx.stroke();

      // Cutout switches / Fuse brackets
      ctx.fillRect(p.x - p.crossarm2W * 0.28, p.transY + 4, 6, 12);
    }

    // Sagging Continuous Hydro Wires
    ctx.strokeStyle = pal.wire;
    ctx.lineWidth = 1.1;
    for (const c of wireCurves) {
      ctx.beginPath();
      ctx.moveTo(c.p0.x, c.p0.y);
      ctx.quadraticCurveTo(c.cp1.x, c.cp1.y, c.p1.x, c.p1.y);
      ctx.stroke();
    }

    // 2. Intricate Bare Winter Tree (Organic Branching)
    ctx.strokeStyle = pal.silhouette;
    for (const b of treeBranches) {
      ctx.lineWidth = b.thickness;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.lineTo(b.x2, b.y2);
      ctx.stroke();
    }
  }

  // --- Initialize Flock ---
  let flock = [];
  function adjustFlockSize() {
    while (flock.length < targetFlockSize) flock.push(new Starling());
    while (flock.length > targetFlockSize) {
      const b = flock.pop();
      if (b.perchTarget) b.perchTarget.occupied = null;
    }
    document.getElementById('hud-stats').innerText = `${flock.length.toLocaleString()} Birds • Wide Horizon Perspective`;
  }

  // --- Main Animation Loop ---
  function loop() {
    drawSky();

    grid.clear();
    for (let i = 0; i < flock.length; i++) {
      grid.insert(flock[i]);
    }

    hawk.update();

    for (let i = 0; i < flock.length; i++) {
      const bird = flock[i];
      if (bird.state === 'flying') {
        const neighbors = grid.getNeighbors(bird, 75);
        bird.flock(neighbors);
      }
      bird.update();
    }

    // Draw silhouette environment
    drawLandscape();

    // Draw Hawk & Boids
    hawk.draw();
    for (let i = 0; i < flock.length; i++) {
      flock[i].draw();
    }

    requestAnimationFrame(loop);
  }

  // --- Interactions ---
  window.addEventListener('resize', resize);
  resize();
  adjustFlockSize();
  requestAnimationFrame(loop);

  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    // Check if tapping near tree or wire zones to flush
    if (py > height * 0.45 && (px > width * 0.6 || px < width * 0.45)) {
      flushAll();
    } else {
      hawk.strike(px, py);
    }
  });

  function flushAll() {
    for (let b of flock) {
      if (b.state === 'perched' || b.state === 'landing') {
        b.flush();
      }
    }
  }

  // --- UI Controls Wireup ---
  const panel = document.getElementById('panel');
  document.getElementById('toggle-panel').addEventListener('click', () => {
    panel.classList.toggle('hidden');
  });

  const sliderFlock = document.getElementById('param-flock');
  sliderFlock.addEventListener('input', (e) => {
    targetFlockSize = parseInt(e.target.value);
    document.getElementById('val-flock').innerText = targetFlockSize;
    adjustFlockSize();
  });

  const sliderCohesion = document.getElementById('param-cohesion');
  sliderCohesion.addEventListener('input', (e) => {
    cohesionWeight = parseFloat(e.target.value);
    document.getElementById('val-cohesion').innerText = cohesionWeight.toFixed(1);
  });

  const sliderPerch = document.getElementById('param-perch');
  sliderPerch.addEventListener('input', (e) => {
    perchAffinity = parseFloat(e.target.value);
    document.getElementById('val-perch').innerText = perchAffinity.toFixed(1);
  });

  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentTheme = e.target.dataset.theme;
    });
  });

  document.getElementById('btn-hawk').addEventListener('click', () => {
    hawk.strike(width * 0.5, height * 0.28);
  });

  document.getElementById('btn-flush').addEventListener('click', () => {
    flushAll();
  });

})();
</script>
</body>
</html>
